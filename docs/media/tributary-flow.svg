<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Tributary</title><desc id="desc">Every coding agent, one stream of work. Three paths join one river. A short entrance animation plays once; reduced-motion users see a still image.</desc>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .pulse{opacity:0;animation:travel 5s ease-out 1 both;transform-box:fill-box;transform-origin:center}
    .second{animation-delay:.45s}.third{animation-delay:.9s}
    @keyframes travel{0%{opacity:0;transform:translateX(-32px)}20%,70%{opacity:1}100%{opacity:0;transform:translateX(170px)}}
    @media(prefers-reduced-motion:reduce){.pulse{animation:none}}
  </style>
  <rect width="1200" height="280" rx="20" fill="#071e2b"/>
  <path d="M0 1H1200" stroke="#244354"/>
  <g transform="translate(70 85)">
    <rect width="96" height="96" rx="26" fill="#4338ca"/>
    <g fill="none" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M24 25c21 0 18 23 39 23h9M24 48h48M24 71c21 0 18-23 39-23"/></g>
  </g>
  <text x="196" y="133" fill="#edf7ff" font-size="58" font-weight="650">Tributary</text>
  <text x="198" y="176" fill="#abc7d8" font-size="22">Every coding agent, one stream of work.</text>
  <g fill="none" stroke="#427fa1" stroke-width="2.5" stroke-linecap="round"><path d="M780 70c80 0 70 70 150 70h215M780 140h365M780 210c80 0 70-70 150-70"/></g>
  <g fill="#79beed"><circle cx="780" cy="70" r="5"/><circle cx="780" cy="140" r="5"/><circle cx="780" cy="210" r="5"/><circle cx="1145" cy="140" r="5"/></g>
  <circle class="pulse" cx="940" cy="140" r="5" fill="#edf7ff"/><circle class="pulse second" cx="940" cy="140" r="5" fill="#edf7ff"/><circle class="pulse third" cx="940" cy="140" r="5" fill="#edf7ff"/>
</svg>
