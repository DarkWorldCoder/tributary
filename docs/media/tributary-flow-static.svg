<text x="62" y="159" font-size="76" font-weight="800" fill="#293750">Tributary</text>
<text x="67" y="207" font-size="28" font-weight="700" fill="#5b50bd">Every agent. One stream of work.</text>
<text x="68" y="254" font-size="20" fill="#3c596c">Build, test, research and create.</text>
<text x="68" y="284" font-size="20" fill="#3c596c">Bring your idea. Keep your context.</text>
