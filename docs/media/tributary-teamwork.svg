<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc"><title id="title">Plan, build and review with your agents</title><desc id="desc">An illustrated workflow: a planning bot passes a file to the Tributary beaver, then a review bot checks the result. The animation is decorative; all steps remain visible without motion.</desc><style>text{font-family:"Trebuchet MS",ui-rounded,system-ui,sans-serif} .ink{stroke:#26374d;stroke-width:4;stroke-linecap:round;stroke-linejoin:round} .fine{stroke:#26374d;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.bob{animation:bob 5s ease-in-out infinite}.bob-late{animation:bob 5s .8s ease-in-out infinite}.eyes{transform-box:fill-box;transform-origin:center;animation:blink 6s linear infinite}.wave{transform-box:fill-box;transform-origin:85% 80%;animation:wave 6s ease-in-out infinite}.parcel{animation:parcel 5.5s ease-in-out infinite}.parcel-late{animation:parcel 5.5s 1s ease-in-out infinite}.spark{animation:spark 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.12)}}@keyframes wave{0%,20%,58%,100%{transform:rotate(0deg)}32%,47%{transform:rotate(10deg)}39%,52%{transform:rotate(-7deg)}}@keyframes parcel{0%,15%{transform:translateX(0);opacity:.35}50%{opacity:1}85%,100%{transform:translateX(65px);opacity:.35}}@keyframes spark{0%,100%{transform:scale(.88);opacity:.65}50%{transform:scale(1);opacity:1}}@media(prefers-reduced-motion:reduce){.bob,.bob-late,.eyes,.wave,.parcel,.parcel-late,.spark{animation:none!important}}</style>
