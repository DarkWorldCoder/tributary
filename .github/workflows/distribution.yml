name: Distribution

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag; leave blank to release this main commit'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: distribution
  queue: max
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      source: ${{ steps.plan.outputs.source }}
      automatic: ${{ steps.plan.outputs.automatic }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - id: plan
        name: Allocate or reuse a release version
        env:
          RELEASE_SOURCE: ${{ github.sha }}
          RELEASE_MANUAL_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: node scripts/release-version.cjs plan

  validate:
    needs: plan
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.source }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - name: Prepare versioned manifests
        run: node scripts/release-version.cjs prepare
      - run: npm ci
      - run: npm ci --prefix ui
      - name: Prepare native discovery toolchain
        run: rustup toolchain install 1.86.0 --profile minimal --target x86_64-unknown-linux-gnu
      - name: Build bounded native discovery engine
        run: npm run build:native
        env:
          RUSTUP_TOOLCHAIN: '1.86.0'
      - name: Verify native discovery parity and crash ownership
        run: |
          node native/tributary-engine/parity.cjs
          node native/tributary-engine/owner-parity.cjs
      - name: Verify native worker admission and termination
        if: runner.os != 'Windows'
        run: node native/tributary-engine/transport-parity.cjs
      - run: npx --prefix ui tsc --noEmit -p ui/tsconfig.json
      - run: npm run build:ui:clean
      - name: Verify owned native and compatibility runtime lifecycle
        run: node --test test/runtime-owner.test.cjs test/local-engine.test.js
      - name: Set Git identity for disposable test repositories
        run: |
          git config --global user.name "Tributary CI"
          git config --global user.email "tributary-ci@users.noreply.github.com"
      - run: npm test

  build:
    needs: [plan, validate]
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15-intel, platform: mac, arch: x64, rust_target: x86_64-apple-darwin }
          - { runner: macos-15, platform: mac, arch: arm64, rust_target: aarch64-apple-darwin }
          - { runner: windows-2025, platform: win, arch: x64, rust_target: x86_64-pc-windows-msvc }
          - { runner: windows-11-arm, platform: win, arch: arm64, rust_target: aarch64-pc-windows-msvc }
          - { runner: ubuntu-24.04, platform: linux, arch: x64, rust_target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, platform: linux, arch: arm64, rust_target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.source }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - name: Prepare versioned manifests
        run: node scripts/release-version.cjs prepare
      - run: npm ci
      - run: npm ci --prefix ui
      - name: Prepare native discovery toolchain
        run: rustup toolchain install 1.86.0 --profile minimal --target ${{ matrix.rust_target }}
      - name: Build bounded native discovery engine
        run: npm run build:native
        env:
          RUSTUP_TOOLCHAIN: '1.86.0'
      - name: Verify native discovery parity and crash ownership
        run: |
          node native/tributary-engine/parity.cjs
          node native/tributary-engine/owner-parity.cjs
      - name: Verify native worker admission and termination
        if: runner.os != 'Windows'
        run: node native/tributary-engine/transport-parity.cjs
      - run: npm run build:ui:clean
      - name: Verify owned native and compatibility runtime lifecycle
        run: node --test test/runtime-owner.test.cjs test/local-engine.test.js
      - name: Package preview installers
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged runtime and native terminal
        run: node scripts/verify-distribution.cjs ${{ matrix.platform }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tributary-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.tar.gz

  publish:
    needs: [plan, build]
    env:
      RELEASE_SOURCE: ${{ needs.plan.outputs.source }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_AUTOMATIC: ${{ needs.plan.outputs.automatic }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.source }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Create immutable version snapshot and tag
        run: |
          git config user.name "Tributary releases"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags origin
          node scripts/release-version.cjs tag
          git push origin "refs/tags/$RELEASE_TAG"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Validate complete release and generate checksums
        run: node scripts/release-assets.cjs release-assets
      - name: Publish preview downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.cjs release-assets
