[package]
name = "tributary-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
publish = false
license = "MIT"
description = "Bounded file discovery and owned local runtimes for Tributary"

[dependencies]
shared_child = { version = "=1.1.2", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.177"
signal-hook = "=0.3.18"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
